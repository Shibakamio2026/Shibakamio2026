spring.application.name=Shibakamio2026

spring.datasource.url=jdbc:postgresql://localhost:5432/shibakamio2026

spring.datasource.username=postgres

spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none

spring.sql.init.mode=always

spring.thymeleaf.cache=false

server.servlet.session.timeout=30m

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG

spring.jpa.properties.hibernate.jdbc.CharacterSet=utf8mb4

spring.jpa.properties.hibernate.jdbc.CharacterEncoding=utf8

server.servlet.session.tracking-modes=cookie

spring.servlet.encoding.charset=UTF-8

spring.servlet.encoding.force=true

spring.servlet.encoding.enabled=true

# テンプレート探索パス
spring.thymeleaf.prefix=classpath:/templates/
# テンプレート拡張子
spring.thymeleaf.suffix=.html

spring.sql.init.schema-locations=classpath:/schema.sql

spring.sql.init.data-locations=classpath:/data.sql

logging.level.org.apache.tomcat.util.net.Acceptor=OFF

spring.servlet.multipart.max-file-size=5MB

spring.servlet.multipart.max-request-size=5MB