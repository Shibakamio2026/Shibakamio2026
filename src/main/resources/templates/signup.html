<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<title>新規アカウント登録 - 家計ログ</title>
</head>

<body>
	<header th:fragment="header">
		<span class="app-logo">家計ログ</span>
	</header>
	<main>
		<h1>新規アカウント登録</h1>

		<form th:action="@{/signup}" th:object="${signupForm}" method="post">
			<div>
				<label for="userName">ユーザー名</label>
				<input type="text" id="userName" th:field="*{userName}">
				<span th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}" style="color: red;"></span>
			</div>
			<div>
				<label for="email">メールアドレス</label>
				<input type="email" id="email" th:field="*{email}">
				<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red;"></span>
			</div>
			<div>
				<label for="password">パスワード</label>
				<input type="password" id="password" th:field="*{password}">
				<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red;"></span>
			</div>
			<div>
				<label for="confirmPassword">パスワード確認用</label>
				<input type="password" id="confirmPassword" th:field="*{confirmPassword}">
				<span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"
					style="color: red;"></span>
			</div>
			<button type="submit">登録</button>
		</form>
		<p><a th:href="@{/login}">ログイン画面に戻る</a></p>
	</main>

	<footer class="site-footer">
		<p>&copy; 2026 Kakei Log</p>
	</footer>
</body>

</html>
