<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head th:replace="~{fragments/layout :: head('新規アカウント登録')}"></head>

<body>
	<header th:replace="~{fragments/layout :: header-auth}"></header>

	<main>
		<div class="auth-card">
			<h1>新規アカウント登録</h1>

			<form th:action="@{/signup}" th:object="${signupForm}" method="post">
				<div>
					<label for="userName">ユーザー名</label>
					<input type="text" id="userName" th:field="*{userName}">
					<span th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}" style="color: red;"></span>
				</div>
				<div>
					<label for="email">メールアドレス</label>
					<input type="email" id="email" th:field="*{email}">
					<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red;"></span>
				</div>
				<div>
					<label for="password">パスワード</label>
					<input type="password" id="password" th:field="*{password}">
					<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red;"></span>
				</div>
				<div>
					<label for="confirmPassword">パスワード確認用</label>
					<input type="password" id="confirmPassword" th:field="*{confirmPassword}">
					<span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"
						style="color: red;"></span>
				</div>
				<button type="submit">登録</button>
			</form>
			<p class="auth-switch">
				<a th:href="@{/login}">ログイン画面に戻る</a>
			</p>
		</div>
	</main>

	<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
