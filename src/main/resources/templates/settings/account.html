<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/error-message.css}">
	<link rel="stylesheet" th:href="@{/css/layout.css}">
	<title>アカウント管理 - 家計ログ</title>
</head>

<body>
	<header th:replace="~{fragments/layout :: header}"></header>

	<main class="dashboard-page">
		<div class="dashboard-layout">
			<aside th:replace="~{fragments/layout :: sidebar('settings')}"></aside>
			<div class="page-content">
				<div class="list-page-card">
					<h1>アカウント管理</h1>

					<p class="success-message" th:if="${successMessage}" th:text="${successMessage}"></p>

					<form th:action="@{/settings/account}" th:object="${accountForm}" method="post">

						<div class="form-row">
							<label for="userName">ユーザー名</label>
							<div th:if="${errors != null and errors.get('userName') != null}" class="field-error"
								th:text="${errors.get('userName')}"></div>
							<input type="text" id="userName" th:field="*{userName}"
								th:classappend="${errors != null and errors.get('userName') != null} ? 'invalid' : ''" />
						</div>

						<div class="form-row">
							<label for="email">メールアドレス</label>
							<div th:if="${errors != null and errors.get('email') != null}" class="field-error"
								th:text="${errors.get('email')}"></div>
							<input type="text" id="email" th:field="*{email}"
								th:classappend="${errors != null and errors.get('email') != null} ? 'invalid' : ''" />
						</div>

						<!-- パスワード変更機能は本システムの対象外（要件10.4） -->

						<button type="submit">保存</button>
					</form>

					<p><a th:href="@{/settings}">設定へ戻る</a></p>

					<div class="danger-zone">
						<p>アカウントを削除すると、収支・資産・カテゴリーなどすべてのデータが失われます。</p>
						<p><a th:href="@{/settings/account/delete}">アカウントを削除する</a></p>
					</div>

				</div>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
