<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/error-message.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <title>アカウント削除 - 家計ログ</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="dashboard-page">
<div class="dashboard-layout">
<aside th:replace="~{fragments/layout :: sidebar('settings')}"></aside>
<div class="page-content">
<div class="list-page-card">
<h1>アカウント削除</h1>

<div class="error-banner">
    アカウントを削除すると、収支・自動収支・予定収支・カテゴリー・資産・資産間振替を含む
    すべてのデータが完全に削除され、元に戻すことはできません。
</div>

<form th:action="@{/settings/account/delete}" th:object="${accountDeleteForm}" method="post">

    <div class="form-row">
        <label for="currentPassword">本人確認のため、現在のパスワードを入力してください</label>
        <div th:if="${errors != null and errors.get('currentPassword') != null}"
             class="field-error" th:text="${errors.get('currentPassword')}"></div>
        <input type="password" id="currentPassword" th:field="*{currentPassword}"
               th:classappend="${errors != null and errors.get('currentPassword') != null} ? 'invalid' : ''"/>
    </div>

    <button type="submit" onclick="return confirm('本当にアカウントを削除しますか？この操作は取り消せません。');">
        アカウントを削除する
    </button>
</form>

<p><a th:href="@{/settings/account}">キャンセル</a></p>

</div>
</div>
</div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
