<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<title>カレンダー - 家計ログ</title>
</head>

<body>
	<header class="site-header">
		<a href="/home" class="app-logo">
			<span>家計ログ</span>
		</a>
		<nav class="site-header-nav" sec:authorize="isAuthenticated()">
			<a th:href="@{/transactions/input}" class="nav-record">＋収支を記録</a>
			<span class="nav-user" sec:authentication="name"></span>
			<form th:action="@{/logout}" method="post" class="nav-logout-form">
				<button type="submit">ログアウト</button>
			</form>
		</nav>
	</header>
	<main class="dashboard-page">
		<div class="dashboard-layout">
			<aside class="sidebar">
				<nav>
					<a th:href="@{/home}">ホーム</a>
					<a th:href="@{/transactions/input}">収支入力</a>
					<a th:href="@{/assets}">口座・資産一覧</a>
					<a th:href="@{/reports}">分析・レポート</a>
					<a th:href="@{/transactions/auto}">自動収支一覧</a>
					<a th:href="@{/transactions/scheduled}">予定収支確認</a>
					<a th:href="@{/calendar}" class="active">カレンダー</a>
					<a th:href="@{/settings}">設定</a>
				</nav>
			</aside>

			<div class="page-content">
				<div class="calender-card">
					<h1 th:text="${targetMonth.year} + '年' + ${targetMonth.monthValue} + '月'"></h1>

					<p>
						<a th:href="@{/calendar(year=${prevMonth.year}, month=${prevMonth.monthValue})}">← 前月</a>
						｜
						<a th:href="@{/calendar(year=${nextMonth.year}, month=${nextMonth.monthValue})}">翌月 →</a>
					</p>

					<table>
						<thead>
							<tr>
								<th>日</th>
								<th>月</th>
								<th>火</th>
								<th>水</th>
								<th>木</th>
								<th>金</th>
								<th>土</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="week : ${weeks}">
								<td th:each="day : ${week}">
									<div th:text="${day.dayOfMonth}"
										th:style="${day.month.value != targetMonth.monthValue} ? 'color:#bbb;' : ''">
									</div>

									<div th:if="${netTotal.get(day)} != null" th:text="${netTotal.get(day)}"
										th:style="${netTotal.get(day)} != null and ${netTotal.get(day)} < 0 ? 'color:#e05c5c;' : 'color:#4caf7d;'">
									</div>

									<div th:each="t : ${byDate.get(day)}">
										<a th:href="@{/transactions/{id}/edit(id=${t.transactionId})}"
											th:text="${t.category.categoryName} + ' ' + ${t.amount}"></a>
									</div>
								</td>
							</tr>
						</tbody>
					</table>

					<p><a th:href="@{/home}">ホームへ戻る</a></p>
				</div>
			</div>
		</div>
	</main>
	<footer class="site-footer">
		<p>&copy; 2026 Kakei Log</p>
	</footer>
</body>

</html>
