<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head th:replace="~{fragments/layout :: head('カレンダー')}"></head>

<body>
	<header th:replace="~{fragments/layout :: header}"></header>

	<main class="dashboard-page">
		<div class="dashboard-layout">
			<aside th:replace="~{fragments/layout :: sidebar('calendar')}"></aside>

			<div class="page-content">
				<div class="calender-card">
					<h1 th:text="${targetMonth.year} + '年' + ${targetMonth.monthValue} + '月'"></h1>

					<p>
						<a th:href="@{/calendar(year=${prevMonth.year}, month=${prevMonth.monthValue})}">← 前月</a>
						｜
						<a th:href="@{/calendar(year=${nextMonth.year}, month=${nextMonth.monthValue})}">翌月 →</a>
					</p>

					<p class="calendar-legend">
						<span class="legend-item is-income">収入</span>
						<span class="legend-item is-expense">支出</span>
					</p>

					<table class="calendar-table">
						<thead>
							<tr>
								<th class="is-sun">日</th>
								<th>月</th>
								<th>火</th>
								<th>水</th>
								<th>木</th>
								<th>金</th>
								<th class="is-sat">土</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="week : ${weeks}">
								<td th:each="day, st : ${week}">

									<div class="calendar-cell"
										th:classappend="(${day.monthValue} != ${targetMonth.monthValue} ? ' is-outside' : '')
										              + (${day.isEqual(today)} ? ' is-today' : '')">

										<div class="calendar-date"
											th:classappend="${st.index} == 0 ? ' is-sun' : (${st.index} == 6 ? ' is-sat' : '')"
											th:text="${day.dayOfMonth}">
										</div>

										<div class="calendar-items">
											<!-- transactionType で色分け（INCOME=緑 / EXPENSE=赤） -->
											<a th:each="t : ${byDate.get(day)}" class="calendar-item"
												th:classappend="${t.transactionType.name()} == 'INCOME' ? ' is-income' : ' is-expense'"
												th:href="@{/transactions/{id}/edit(id=${t.transactionId})}"
												th:title="${(t.category != null ? t.category.categoryName : '未分類')
												          + ' ' + #numbers.formatInteger(t.amount, 1, 'COMMA') + '円'}">
												<span class="item-name"
													th:text="${t.category != null ? t.category.categoryName : '未分類'}"></span>
												<span class="item-amount"
													th:text="${#numbers.formatInteger(t.amount, 1, 'COMMA')}"></span>
											</a>

											<!-- あふれた分は「他n件」でまとめて、その日の一覧へ -->
											<a th:if="${moreCount.get(day)} != null" class="calendar-more"
												th:href="@{/transactions/list(from=${day}, to=${day})}"
												th:text="'他 ' + ${moreCount.get(day)} + '件 →'"></a>
										</div>
									</div>
								</td>
							</tr>
						</tbody>
					</table>

					<p class="page-nav-links"><a th:href="@{/home}">ホームへ戻る</a></p>
				</div>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
