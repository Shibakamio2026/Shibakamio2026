<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head th:replace="~{fragments/layout :: head('カレンダー')}"></head>

<body>
	<header th:replace="~{fragments/layout :: header}"></header>

	<main class="dashboard-page">
		<div class="dashboard-layout">
			<aside th:replace="~{fragments/layout :: sidebar('calendar')}"></aside>

			<div class="page-content">
				<div class="calender-card">
					<h1 th:text="${targetMonth.year} + '年' + ${targetMonth.monthValue} + '月'"></h1>

					<p>
						<a th:href="@{/calendar(year=${prevMonth.year}, month=${prevMonth.monthValue})}">← 前月</a>
						｜
						<a th:href="@{/calendar(year=${nextMonth.year}, month=${nextMonth.monthValue})}">翌月 →</a>
					</p>

					<p style="text-align:center; font-size:0.8rem; color:#6b7d73;">
						<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#2f9e5b;margin-right:4px;"></span>収入
						<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#d9534f;margin:0 4px 0 14px;"></span>支出
					</p>

					<table class="calendar-table">
						<thead>
							<tr>
								<th>日</th>
								<th>月</th>
								<th>火</th>
								<th>水</th>
								<th>木</th>
								<th>金</th>
								<th>土</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="week : ${weeks}">
								<td th:each="day : ${week}" class="calendar-cell">
									<div class="calendar-date"
										th:text="${day.dayOfMonth}"
										th:style="${day.month.value != targetMonth.monthValue} ? 'color:#bbb;' : ''">
									</div>

									<!-- 取引（Java側で、すでに MAX_ITEMS_PER_DAY 件に、絞り込み済み） -->
									<div th:each="t : ${byDate.get(day)}" class="calendar-entry"
										th:classappend="${t.transactionType.name() == 'EXPENSE'} ? 'calendar-entry-expense' : 'calendar-entry-income'">
										<a th:href="@{/transactions/{id}/edit(id=${t.transactionId})}" class="calendar-entry-row">
											<span class="calendar-entry-category" th:text="${t.category.categoryName}"></span>
											<span class="calendar-entry-amount" th:text="'¥' + ${t.amount}"></span>
										</a>
									</div>

									<!-- あふれた件数（Java側の moreCount をそのまま使う） -->
									<div class="calendar-entry-more" th:if="${moreCount.get(day)} != null">
										<a th:href="@{/transactions/list(from=${day}, to=${day})}"
											th:text="'他 ' + ${moreCount.get(day)} + '件 →'"></a>
									</div>
								</td>
							</tr>
						</tbody>
					</table>

					<p><a th:href="@{/home}">ホームへ戻る</a></p>
				</div>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments/layout :: footer}"></footer>

	<style>
		.calendar-table {
			width: 100%;
			border-collapse: collapse;
			table-layout: fixed;
		}

		.calendar-table th,
		.calendar-table td {
			border: 1px solid #e3f0e8;
		}

		.calendar-table th {
			background: #f2fbf6;
			padding: 8px 4px;
			font-size: 0.85rem;
		}

		.calendar-cell {
			vertical-align: top;
			height: 100px;
			padding: 4px 6px;
		}

		.calendar-date {
			font-size: 0.8rem;
			color: #6b7d73;
			margin-bottom: 2px;
		}

		.calendar-entry {
			font-size: 0.68rem;
			line-height: 1.25;
		}

		.calendar-entry-row {
			display: flex;
			flex-direction: column;
			text-decoration: none;
		}

		.calendar-entry-category {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.calendar-entry-amount {
			font-weight: bold;
		}

		.calendar-entry-income a {
			color: #2f9e5b;
		}

		.calendar-entry-expense a {
			color: #d9534f;
		}

		.calendar-entry-more {
			font-size: 0.68rem;
			margin-top: 2px;
		}

		.calendar-entry-more a {
			color: #6b7d73;
		}
	</style>
</body>

</html>
