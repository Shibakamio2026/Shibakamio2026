<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head th:replace="~{fragments/layout :: head('ダッシュボード')}"></head>

<body>
	<header th:replace="~{fragments/layout :: header}"></header>

	<main class="dashboard-page">
		<div class="dashboard-layout">
			<aside th:replace="~{fragments/layout :: sidebar('home')}"></aside>

			<div class="dashboard-main">
				<h1>ダッシュボード</h1>
				<p class="welcome-text">ようこそ、<span th:text="${userName}"></span>さん！</p>

				<section class="summary-cards">
					<div class="stat-card">
						<div class="stat-label">総資産額</div>
						<div class="stat-value"
							th:text="'¥' + ${#numbers.formatInteger(totalAssetBalance, 0, 'COMMA')}">
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-label">今月の収入</div>
						<div class="stat-value" th:text="'¥' + ${#numbers.formatInteger(monthlyIncome, 0, 'COMMA')}">
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-label">今月の支出</div>
						<div class="stat-value" th:text="'¥' + ${#numbers.formatInteger(monthlyExpense, 0, 'COMMA')}">
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-label">見込み残高</div>
						<div class="stat-value" th:text="'¥' + ${#numbers.formatInteger(projectedBalance, 0, 'COMMA')}">
						</div>
					</div>
				</section>

				<section class="main-columns">
					<div class="chart-card">
						<div class="tab-buttons">
							<button type="button" class="active">資産推移</button>
							<button type="button">月刊収支</button>
						</div>
						<p class="placeholder-note">グラフは「分析・レポート」画面で今後表示されます</p>
					</div>
					<div class="chart-card">
						<h3>今月の支出内訳（円グラフ）</h3>
						<p class="placeholder-note">グラフは「分析・レポート」画面で今後表示されます</p>
					</div>
				</section>

				<section class="two-col">
					<div class="list-card">
						<h3>最近の取引履歴（直近5件）</h3>
						<ul>
							<li th:each="t : ${recentTransactions}">
								<span th:text="${t.transactionDate} + ' ' + ${t.category.categoryName}"></span>
								<span
									th:text="(${t.transactionType.name() == 'EXPENSE'} ? '-' : '+') + '¥' + ${#numbers.formatInteger(t.amount, 0, 'COMMA')}"
									th:classappend="${t.transactionType.name() == 'EXPENSE'} ? 'amount-expense' : 'amount-income'"></span>
							</li>
							<li th:if="${recentTransactions.isEmpty()}">まだ取引履歴がありません</li>
						</ul>
						<a th:href="@{/transactions/list}">すべての履歴を見る →</a>
					</div>

					<div class="list-card">
						<h3>連携口座・資産内訳</h3>
						<ul>
							<li th:each="entry : ${assetBalances}">
								<span th:text="${entry.key.assetName}"></span>
								<span th:text="'¥' + ${#numbers.formatInteger(entry.value, 0, 'COMMA')}"></span>
							</li>
							<li th:if="${assetBalances.isEmpty()}">まだ資産が登録されていません</li>
						</ul>
						<a th:href="@{/assets}">資産口座を追加・更新 →</a>
					</div>
				</section>

				<section class="list-card">
					<h3>予定収支サマリー</h3>
					<p>
						今月予定されている自動収支: <span th:text="${scheduledCount}"></span>件
						(<span
							th:text="(${scheduledNet} >= 0 ? '+' : '') + '¥' + ${#numbers.formatInteger(scheduledNet, 0, 'COMMA')}"></span>)
					</p>
					<a th:href="@{/transactions/scheduled}">予定収支確認画面へ →</a>
				</section>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
