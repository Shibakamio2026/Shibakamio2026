<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head th:replace="~{fragments/layout :: head('ダッシュボード')}"></head>

<body>
	<header th:replace="~{fragments/layout :: header}"></header>

	<main class="dashboard-page">
		<div class="dashboard-layout">
			<aside th:replace="~{fragments/layout :: sidebar('home')}"></aside>

			<div class="dashboard-main">
				<h1>ダッシュボード</h1>
				<p class="welcome-text">ようこそ、<span th:text="${userName}"></span>さん！</p>

				<section class="summary-cards">
					<div class="stat-card">
						<div class="stat-label">総資産額</div>
						<div class="stat-value"
							th:text="'¥' + ${#numbers.formatInteger(totalAssetBalance, 0, 'COMMA')}">
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-label">今月の収入</div>
						<div class="stat-value" th:text="'¥' + ${#numbers.formatInteger(monthlyIncome, 0, 'COMMA')}">
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-label">今月の支出</div>
						<div class="stat-value" th:text="'¥' + ${#numbers.formatInteger(monthlyExpense, 0, 'COMMA')}">
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-label">見込み残高</div>
						<div class="stat-value" th:text="'¥' + ${#numbers.formatInteger(projectedBalance, 0, 'COMMA')}">
						</div>
					</div>
				</section>

				<section class="main-columns">
					<!-- ===== 左：資産推移 / 月間収支 タブ ===== -->
					<div class="chart-card">
						<div class="tab-buttons">
							<button type="button" class="active" data-tab="assetTrend">資産推移</button>
							<button type="button" data-tab="monthlyBalance">月間収支</button>
						</div>

						<!-- 資産推移：各月末時点の総資産残高 -->
						<div class="tab-panel" id="tab-assetTrend">
							<div class="bar-chart">
								<div class="bar-group" th:each="p : ${assetTrend}">
									<div class="bar-stack">
										<div class="bar bar-asset" th:style="'height:' + ${p.percent} + '%'"
											th:title="${p.label} + ' ¥' + ${#numbers.formatInteger(p.value, 0, 'COMMA')}">
										</div>
									</div>
									<div class="bar-label" th:text="${p.label}"></div>
								</div>
							</div>
							<p class="chart-note">各月末時点の総資産残高</p>
						</div>

						<!-- 月間収支：確定済みの収入・支出 -->
						<div class="tab-panel is-hidden" id="tab-monthlyBalance">
							<div class="bar-chart">
								<div class="bar-group" th:each="m : ${monthlySummaries}">
									<div class="bar-stack is-pair">
										<div class="bar bar-income" th:style="'height:' + ${m.incomeBarPercent} + '%'"
											th:title="'収入 ¥' + ${#numbers.formatInteger(m.confirmedIncome, 0, 'COMMA')}">
										</div>
										<div class="bar bar-expense" th:style="'height:' + ${m.expenseBarPercent} + '%'"
											th:title="'支出 ¥' + ${#numbers.formatInteger(m.confirmedExpense, 0, 'COMMA')}">
										</div>
									</div>
									<div class="bar-label" th:text="${#strings.substring(m.yearMonth, 5)} + '月'"></div>
								</div>
							</div>
							<p class="chart-legend">
								<span class="legend-dot bar-income"></span>収入
								<span class="legend-dot bar-expense"></span>支出
							</p>
						</div>
					</div>

					<!-- ===== 右：今月の支出内訳（円グラフ） ===== -->
					<div class="chart-card">
						<h3>今月の支出内訳</h3>

						<div class="pie-wrap" th:if="${!expensePie.isEmpty()}">
							<div class="pie" th:style="'background: conic-gradient(' + ${expensePieGradient} + ')'">
							</div>
							<ul class="pie-legend">
								<li th:each="s : ${expensePie}">
									<span class="legend-dot" th:style="'background-color:' + ${s.color}"></span>
									<span class="legend-name" th:text="${s.label}"></span>
									<span class="legend-value" th:text="'¥' + ${#numbers.formatInteger(s.amount, 0, 'COMMA')}
										        + '（' + ${#numbers.formatDecimal(s.percent, 1, 1)} + '%）'"></span>
								</li>
							</ul>
						</div>

						<p class="placeholder-note" th:if="${expensePie.isEmpty()}">今月の支出データがまだありません</p>
					</div>
				</section>

				<section class="two-col">
					<div class="list-card">
						<h3>最近の取引履歴（直近5件）</h3>
						<ul>
							<li th:each="t : ${recentTransactions}">
								<span th:text="${t.transactionDate} + ' ' + ${t.category.categoryName}"></span>
								<span
									th:text="(${t.transactionType.name() == 'EXPENSE'} ? '-' : '+') + '¥' + ${#numbers.formatInteger(t.amount, 0, 'COMMA')}"
									th:classappend="${t.transactionType.name() == 'EXPENSE'} ? 'amount-expense' : 'amount-income'"></span>
							</li>
							<li th:if="${recentTransactions.isEmpty()}">まだ取引履歴がありません</li>
						</ul>
						<a th:href="@{/transactions/list}">すべての履歴を見る →</a>
					</div>

					<div class="list-card">
						<h3>連携口座・資産内訳</h3>
						<ul>
							<li th:each="entry : ${assetBalances}">
								<span th:text="${entry.key.assetName}"></span>
								<span th:text="'¥' + ${#numbers.formatInteger(entry.value, 0, 'COMMA')}"></span>
							</li>
							<li th:if="${assetBalances.isEmpty()}">まだ資産が登録されていません</li>
						</ul>
						<a th:href="@{/assets}">資産口座を追加・更新 →</a>
					</div>
				</section>

				<section class="list-card">
					<h3>予定収支サマリー</h3>
					<p>
						今月予定されている自動収支: <span th:text="${scheduledCount}"></span>件
						(<span
							th:text="(${scheduledNet} >= 0 ? '+' : '') + '¥' + ${#numbers.formatInteger(scheduledNet, 0, 'COMMA')}"></span>)
					</p>
					<a th:href="@{/transactions/scheduled}">予定収支確認画面へ →</a>
				</section>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments/layout :: footer}"></footer>

	<script>
		// グラフのタブ切り替え
		document.querySelectorAll('.tab-buttons button[data-tab]').forEach(function (btn) {
			btn.addEventListener('click', function () {
				var card = btn.closest('.chart-card');
				card.querySelectorAll('.tab-buttons button').forEach(function (b) {
					b.classList.remove('active');
				});
				card.querySelectorAll('.tab-panel').forEach(function (p) {
					p.classList.add('is-hidden');
				});
				btn.classList.add('active');
				card.querySelector('#tab-' + btn.dataset.tab).classList.remove('is-hidden');
			});
		});
	</script>
</body>

</html>
