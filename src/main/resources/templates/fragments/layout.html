<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<title th:text="${title} + ' - 家計ログ'">家計ログ</title>
</head>

<body>

	<header th:fragment="header" class="site-header">
		<a th:href="@{/home}" class="app-logo">
			<span>家計ログ</span>
		</a>
		<nav class="site-header-nav">
			<a th:href="@{/transactions/input}" class="nav-record">＋収支を記録</a>
			<span class="nav-user" th:text="${currentUserName} ?: ''"></span>
			<form th:action="@{/logout}" method="post" class="nav-logout-form">
				<button type="submit">ログアウト</button>
			</form>
		</nav>
	</header>

	<header th:fragment="header-auth" class="site-header">
		<span class="app-logo">家計ログ</span>
	</header>

	<aside th:fragment="sidebar(active)" class="sidebar">
		<nav>
			<a th:href="@{/home}" th:classappend="${active == 'home'}      ? 'active'">ホーム</a>
			<a th:href="@{/transactions/input}" th:classappend="${active == 'input'}     ? 'active'">収支入力</a>
			<a th:href="@{/assets}" th:classappend="${active == 'assets'}    ? 'active'">口座・資産一覧</a>
			<a th:href="@{/reports}" th:classappend="${active == 'reports'}   ? 'active'">分析・レポート</a>
			<a th:href="@{/transactions/auto}" th:classappend="${active == 'auto'}      ? 'active'">自動収支一覧</a>
			<a th:href="@{/transactions/scheduled}" th:classappend="${active == 'scheduled'} ? 'active'">予定収支確認</a>
			<a th:href="@{/calendar}" th:classappend="${active == 'calendar'}  ? 'active'">カレンダー</a>
			<a th:href="@{/settings}" th:classappend="${active == 'settings'}  ? 'active'">設定</a>
		</nav>
	</aside>

	<footer th:fragment="footer" class="site-footer">
		<p>&copy; 2026 Kakei Log</p>
	</footer>

</body>

</html>
