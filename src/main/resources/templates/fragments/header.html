<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <header th:fragment="header">
        <span class="app-logo">家計ログ</span>
        <nav sec:authorize="isAuthenticated()">
            <a th:href="@{/transactions/input}" class="nav-record">＋収支を記録</a>
            <span class="nav-user" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" class="nav-logout-form">
                <button type="submit">ログアウト</button>
            </form>
        </nav>
    </header>
</body>
</html>
