<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<title>予定収支確認 - 家計ログ</title>
</head>

<body>
	<header>
		<a href="/home" class="app-logo">
			<span>家計ログ</span>
		</a>
		<nav sec:authorize="isAuthenticated()">
			<a th:href="@{/transactions/input}" class="nav-record">＋収支を記録</a>
			<span class="nav-user" sec:authentication="name"></span>
			<form th:action="@{/logout}" method="post" class="nav-logout-form">
				<button type="submit">ログアウト</button>
			</form>
		</nav>
	</header>
	<main>
		<h1>予定収支確認</h1>

		<table th:if="${!scheduledTransactions.isEmpty()}">
			<thead>
				<tr>
					<th>予定日</th>
					<th>種別</th>
					<th>カテゴリー</th>
					<th>資産</th>
					<th>金額</th>
					<th>状態</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="s : ${scheduledTransactions}">
					<td th:text="${s.scheduledDate}"></td>
					<td th:text="${s.transactionType.name() == 'INCOME'} ? '収入' : '支出'"></td>
					<td th:text="${s.category.categoryName}"></td>
					<td th:text="${s.asset.assetName}"></td>
					<td th:text="${s.amount}"></td>
					<td th:text="${s.status.name() == 'PLANNED'} ? '予定' : '確認待ち'"></td>
					<td>
						<form th:action="@{/transactions/scheduled/{id}/confirm(id=${s.scheduledTransactionId})}"
							method="post" style="display:inline;">
							<button type="submit">確定する</button>
						</form>
						<form th:action="@{/transactions/scheduled/{id}/cancel(id=${s.scheduledTransactionId})}"
							method="post" style="display:inline;" onsubmit="return confirm('この予定をキャンセルしますか？');">
							<button type="submit">キャンセル</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>

		<p th:if="${scheduledTransactions.isEmpty()}">確認が必要な予定収支はありません</p>

		<p><a th:href="@{/transactions/auto}">自動収支一覧へ</a></p>
		<p><a th:href="@{/home}">ホームへ戻る</a></p>
	</main>
	<footer class="site-footer">
		<p>&copy; 2026 Kakei Log</p>
	</footer>
</body>

</html>
