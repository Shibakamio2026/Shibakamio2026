<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head th:replace="~{fragments/layout :: head('自動収支一覧')}"></head>

<body>
	<header th:replace="~{fragments/layout :: header}"></header>

	<main class="dashboard-page">
		<div class="dashboard-layout">
			<aside th:replace="~{fragments/layout :: sidebar('auto')}"></aside>

			<div class="page-content">
				<div class="list-page-card">
					<h1>自動収支一覧</h1>

					<div class="data-table-scroll" th:if="${!autoTransactions.isEmpty()}">
						<table class="data-table">
							<thead>
								<tr>
									<th>種別</th>
									<th>カテゴリー</th>
									<th>資産</th>
									<th class="amount">金額</th>
									<th>間隔</th>
									<th>開始日</th>
									<th>終了日</th>
									<th>状態</th>
									<th></th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="a : ${autoTransactions}">
									<td th:classappend="${a.transactionType.name()} == 'INCOME' ? 'type-income' : 'type-expense'"
										th:text="${a.transactionType.name() == 'INCOME'} ? '収入' : '支出'"></td>
									<td th:text="${a.category.categoryName}"></td>
									<td th:text="${a.asset.assetName}"></td>
									<td class="amount" th:text="${#numbers.formatInteger(a.amount, 1, 'COMMA')}"></td>
									<td
										th:text="${a.intervalType.name() == 'WEEKLY'} ? '毎週' : (${a.intervalType.name() == 'MONTHLY'} ? '毎月' : '毎年')">
									</td>
									<td th:text="${a.startDate}"></td>
									<td th:text="${a.endDate} ?: '無期限'"></td>
									<td th:text="${a.enabled} ? '有効' : '無効'"></td>
									<td class="actions">
										<form th:if="${a.enabled}"
											th:action="@{/transactions/auto/{id}/disable(id=${a.autoTransactionId})}"
											method="post" onsubmit="return confirm('この自動収支を停止しますか？未確定の予定もキャンセルされます。');">
											<button type="submit" class="btn-quiet">停止する</button>
										</form>
									</td>
								</tr>
							</tbody>
						</table>
					</div>

					<p th:if="${autoTransactions.isEmpty()}">登録されている自動収支はありません</p>

					<p class="page-nav-links">
						<a th:href="@{/transactions/scheduled}">予定収支確認画面へ</a>
						｜
						<a th:href="@{/home}">ホームへ戻る</a>
					</p>
				</div>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
